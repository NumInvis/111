services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: variational_infinity
      POSTGRES_USER: vi
      POSTGRES_PASSWORD: vi_local_dev
    ports:
      - '5432:5432'
    volumes:
      - vi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vi -d variational_infinity']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vi_pgdata:
